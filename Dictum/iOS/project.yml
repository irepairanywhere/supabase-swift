# XcodeGen spec for the iPhone app + keyboard extension.
#   brew install xcodegen
#   cd Dictum/iOS && xcodegen generate && open DictumMobile.xcodeproj
# Then pick your team under Signing & Capabilities for BOTH targets (a free Apple ID works).
name: DictumMobile
options:
  bundleIdPrefix: app.dictum
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  DictumCore:
    path: ../DictumCore
targets:
  DictumMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: DictumCore
        product: DictumCore
      - target: DictumKeyboard
        embed: true
    entitlements:
      path: App/DictumMobile.entitlements
    settings:
      base:
        PRODUCT_NAME: Dictum
        PRODUCT_BUNDLE_IDENTIFIER: app.dictum.mobile
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  DictumKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    dependencies:
      - package: DictumCore
        product: DictumCore
    entitlements:
      path: Keyboard/DictumKeyboard.entitlements
    settings:
      base:
        PRODUCT_NAME: DictumKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: app.dictum.mobile.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
